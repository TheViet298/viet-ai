name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          GOOGLE_API_KEY: test-key

      - name: RAG engineering regression gate
        run: python scripts/check_rag_quality.py --engineering --output eval/results/ci/rag-engineering.json
        env:
          AGENT_LLM_ENABLED: 'false'

      - name: Upload RAG engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-engineering-report
          path: eval/results/ci/rag-engineering.json
          if-no-files-found: warn
