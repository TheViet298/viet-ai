events {}
http {
    # Never log $request, $request_uri, $args, headers or request bodies.
    log_format gps '$request_method $uri $status $body_bytes_sent';
    access_log /var/log/nginx/access.log gps;
    # Nginx error lines can contain the original URI, including coordinates.
    # This isolated test profile disables them; use access status for failures.
    error_log /dev/null crit;
    server {
        listen 8443 ssl;
        ssl_certificate /etc/gps-tls/cert.pem;
        ssl_certificate_key /etc/gps-tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location /api/v1/ {
            proxy_pass http://127.0.0.1:18000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache off;
        }
        location / {
            proxy_pass http://127.0.0.1:13000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
