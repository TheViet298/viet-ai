<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1435" viewBox="0 0 1000 1435" xml:lang="vi" role="img" aria-labelledby="title desc">
<title id="title">ServiceFlow · Trình tự xử lý yêu cầu dịch vụ</title><desc id="desc">Luồng FastAPI hiện tại · API dưới /api/v1 · thời gian từ trên xuống. Thời gian đi từ trên xuống; mũi tên nét đứt biểu thị phản hồi.</desc>
