<rect x="430" y="102" width="140" height="46" rx="5" fill="#f0ecf7" stroke="#9ba9b6"/>
<text x="500" y="131" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" fill="#263747" font-weight="600">Tác tử chatbot</text>
<path d="M500 148 V1002" stroke="#aab5bf" stroke-dasharray="5 6"/>
<rect x="630" y="102" width="140" height="46" rx="5" fill="#f0ecf7" stroke="#9ba9b6"/>
<text x="700" y="131" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" fill="#263747" font-weight="600">Dịch vụ RAG</text>
<path d="M700 148 V1002" stroke="#aab5bf" stroke-dasharray="5 6"/>
<rect x="830" y="102" width="140" height="46" rx="5" fill="#edf5ee" stroke="#9ba9b6"/>
<text x="900" y="131" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" fill="#263747" font-weight="600">ChromaDB</text>
<path d="M900 148 V1002" stroke="#aab5bf" stroke-dasharray="5 6"/>
<rect x="30" y="166" width="940" height="32" rx="3" fill="#eef2f6"/>
<text x="43" y="188" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start" fill="#263747" font-weight="600">01   Kiểm tra an toàn trước khi truy xuất</text>
<path d="M100 230 H300" fill="none" stroke="#435568" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="200.0" y="221" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">Tin nhắn</text>
<path d="M300 280 H500" fill="none" stroke="#435568" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="400.0" y="271" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">process_chat_message</text>
<path d="M500 325 h42 v22 h-42" fill="none" stroke="#435568" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="550" y="341" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start" fill="#263747" font-weight="400">Ẩn PII; kiểm tra an toàn</text>
<path d="M36 370 H964" stroke="#c8d1d9" stroke-dasharray="3 4"/>
<text x="44" y="392" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="start" fill="#263747" font-weight="600">alt  [nguy cơ khẩn cấp hoặc ngoài phạm vi]</text>
<path d="M500 425 H300" fill="none" stroke="#435568" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
