<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" xml:lang="vi" role="img" aria-labelledby="title desc">
<title id="title">ServiceFlow · Trình tự hội thoại RAG</title><desc id="desc">Luồng riêng /api/v1/chat · trả về cờ yêu cầu nhân viên duyệt. Thời gian đi từ trên xuống; mũi tên nét đứt biểu thị phản hồi.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#435568" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="36" y="46" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="start" fill="#263747" font-weight="600">ServiceFlow · Trình tự hội thoại RAG</text>
<text x="36" y="76" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start" fill="#263747" font-weight="400">Luồng riêng /api/v1/chat · trả về cờ yêu cầu nhân viên duyệt</text>
<rect x="30" y="102" width="140" height="46" rx="5" fill="#eaf2fb" stroke="#9ba9b6"/>
<text x="100" y="131" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" fill="#263747" font-weight="600">Bên gọi</text>
<path d="M100 148 V1002" stroke="#aab5bf" stroke-dasharray="5 6"/>
<rect x="230" y="102" width="140" height="46" rx="5" fill="#edf1f5" stroke="#9ba9b6"/>
<text x="300" y="131" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" fill="#263747" font-weight="600">API hội thoại</text>
