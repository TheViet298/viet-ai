<text x="200.0" y="461" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">Phản hồi hội thoại</text>
<path d="M36 495 H964" stroke="#c8d1d9" stroke-dasharray="3 4"/>
<text x="44" y="517" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="start" fill="#263747" font-weight="600">else  [trong phạm vi; không khẩn cấp]</text>
<path d="M500 550 H700" fill="none" stroke="#435568" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="600.0" y="541" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">Truy xuất 2 kết quả</text>
<path d="M700 595 H900" fill="none" stroke="#435568" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="800.0" y="586" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">Truy vấn collection</text>
<path d="M900 640 H700" fill="none" stroke="#435568" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="800.0" y="631" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">Tài liệu + khoảng cách</text>
<path d="M700 685 H500" fill="none" stroke="#435568" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="600.0" y="676" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">Ngữ cảnh + trích dẫn / NO_SOURCE</text>
<rect x="30" y="715" width="940" height="32" rx="3" fill="#eef2f6"/>
<text x="43" y="737" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start" fill="#263747" font-weight="600">02   Trả lời có căn cứ hoặc yêu cầu nhân viên duyệt</text>
<path d="M36 760 H964" stroke="#c8d1d9" stroke-dasharray="3 4"/>
<text x="44" y="782" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="start" fill="#263747" font-weight="600">alt  [NO_SOURCE] → phản hồi kèm cờ cần duyệt</text>
<path d="M36 802 H964" stroke="#c8d1d9" stroke-dasharray="3 4"/>
<text x="44" y="824" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="start" fill="#263747" font-weight="600">else  [có nguồn] → gọi Gemini nếu đã cấu hình; nếu không, trích xuất tài liệu</text>
<path d="M500 850 h42 v22 h-42" fill="none" stroke="#435568" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="550" y="866" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start" fill="#263747" font-weight="400">Tạo câu trả lời; xét cờ duyệt</text>
<path d="M500 920 H300" fill="none" stroke="#435568" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="400.0" y="911" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">Trả lời + trích dẫn + cờ</text>
<path d="M300 975 H100" fill="none" stroke="#435568" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="200.0" y="966" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">Phản hồi hội thoại</text>
<rect x="30" y="370" width="940" height="331" fill="none" stroke="#aab5bf" stroke-width="1"/>
<rect x="30" y="760" width="940" height="131" fill="none" stroke="#aab5bf" stroke-width="1"/>
</svg>
