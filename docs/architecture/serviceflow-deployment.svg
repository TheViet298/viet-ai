<svg xmlns="http://www.w3.org/2000/svg" width="270mm" height="252mm" viewBox="0 0 1200 1120" xml:lang="vi" role="img" aria-labelledby="title desc">
<title id="title">ServiceFlow — Sơ đồ triển khai</title>
<desc id="desc">Cấu hình cục bộ: trình duyệt truy cập Next.js và backend Docker, backend sử dụng bind mount dữ liệu và gọi Gemini tùy cấu hình. Demo độc lập dùng HTTP server và SQLite riêng.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#506273" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="1120" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
